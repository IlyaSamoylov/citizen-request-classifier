[project]
name = "citizen-request-classifier"
version = "0.1.0"
description = "Service for classification of citizen requests"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
      "fastapi>=0.112.0",
      "uvicorn[standard]>=0.30.0",
      "sqlalchemy>=2.0.30",
      "pydantic[email]>=2.7.0",
      "pydantic-settings>=2.3.0",
      "python-jose[cryptography]>=3.3.0",
      "passlib[bcrypt]>=1.7.4",
      "httpx>=0.27.0",
      "python-multipart>=0.0.9",
      "greenlet>=3.3.1",
      "bcrypt==4.3.0",
      "alembic>=1.18.4",
      "pyyaml>=6.0.3",
      "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
